name: Validate EyeKart repair branch

on:
  push:
    branches:
      - repair/production-backend
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run lint

      - name: Test read-only Vercel API snapshot
        run: bun run test:api-snapshot

      - name: Build frontend
        run: bun run build
