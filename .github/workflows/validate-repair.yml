name: Validate EyeKart repair branch

on:
  push:
    branches:
      - repair/production-backend
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Type-check browser/server TypeScript
        run: bun run lint

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check Supabase Edge Function
        run: deno check supabase/functions/eyekart-api/index.ts

      - name: Test read-only Vercel API snapshot
        run: bun run test:api-snapshot

      - name: Build frontend
        run: bun run build
